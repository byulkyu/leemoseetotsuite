`<h4>BGM</h4><a href="#" onclick="tg();return false">${bgm?'[ON] ♪ OFFにする':'[OFF] ♪ ONにする'}</a><h4>COUNTER</h4><div class="cnt"><span>0</span><span>0</span><span>0</span><span>6</span><span>6</span><span>6</span></div><div class="sm">あなたは000666人目の訪問者です。</div><h4>Last Update</h4><div class="sm">2026/10/07</div><p class="sm">このページはリンクフリーです。</p>`;
main.innerHTML=P[k][1]+'<div class="end">本記録は現在も終了していない。</div>';

function tg(){bgm=!bgm;if(bgm){ac=ac||new (window.AudioContext||window.webkitAudioContext)();const M=[60,64,67,72,67,64,65,69,72,77,72,69,67,71,74,79,74,71,60,64,67,72,76,72,67,65,64,62,60];
tm=setInterval(()=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=440*Math.pow(2,(M[st%M.length]-69)/12);g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.28);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3);st++},300)}else clearInterval(tm);show(location.hash.slice(1))}
