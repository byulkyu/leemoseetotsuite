["2024년 5월 19일","자닐라 서버 권력 남용 사건","이모씨가 자닐라 서버에서 권한을 갖게 된 이후, 시민들의 재산을 강제로 회수하여 안산암에게 전달하려 하였다.","이를 거부하는 사람에게는 강한 제재가 실시되었다. 이후 이모씨는 권한에서 물러나게 되었으며, 해당 서버의 몰락 과정에 영향을 끼친 사건으로 기록되고 있다."],

["2024년 8월 26일","권한에 대한 설정 착오 사건","권한 설정의 오류로 인하여, 규민이 서버에서 정상적으로 활동하는 것이 불가능하게 되었다.","이후 규민은 서버를 나갔다가 다시 입장하였다."],

["2024년 10월","마익 비교 사건","아포의 마인크리에이트와 이모씨의 마인크리에이트 익스펜션을 둘러싼 비교 및 개입의 과정에서 발생한 사건이다.","특히 이모씨가 특정한 요소를 마익에 포함해야 한다는 취지의 개입을 실시하게 되면서, 문제가 누적되었다."],
["2024년 10월","김하늘 드립 사건","김하늘과 관련된 사망 소재의 부적절한 농담이 오가게 되었다.","규민이 이모씨의 반응을 공개하면서 서버 내에서 큰 문제가 되었고, 이모씨는 탄핵되는 결과에 이르렀다. ※ 사망에 관한 표현은 본 사이트에서는 상세히 기재하지 않는다."],

about:["이모씨란","<h2>이모씨란</h2><p>이모씨는 서버 및 커뮤니티 활동에 있어서 규민, 하누리, 안산암, 뮤시, os, 아포 등의 관계자와 교류를 가져 온 인물인 것으로 알려져 있다.</p><p>2023년 10월의 사건을 시작으로, 2026년 현재에 이르기까지 21건의 사건이 확인되고 있다. 2024년에는 서버 권한, 운영 및 집단 내의 갈등이 중심이었던 것으로 보인다.</p><p>본 사이트는 해당 인물을 평가하기 위한 것이 아니며, 확인된 사건을 시간순으로 정리하는 것을 목적으로 하고 있다.</p><p class='sm'>관계자 사이에서는 견해가 나뉘고 있다.</p>"],
tl:["사건・사고 연표","<h2>사건・사고 연표 (시간순)</h2><p class='sm'>사건명을 클릭하시면 상세한 기록이 열람 가능합니다. 열람에 있어서는 주의해 주십시오.</p><div id='tl'></div>"],
rank:["사건 중요도 랭킹","<h2>事件重大度 랭킹</h2><p class='red'>※ 본 순위는 관리인이 사건의 영향, 지속 기간, 관계자에 대한 영향 및 사건의 특징 등을 종합하여 독자적으로 분류한 것입니다. 객관적인 평가를 의미하는 것은 아닙니다.</p><table class='r'><tr><th>순위</th><th>사건명</th><th>일시</th></tr><tbody id='rk'></tbody></table>"],
trait:["특징적 기록","<h2>이모씨의 행동에서 반복적으로 확인되는 특징</h2><p>첫째, 상대방의 경계가 충분히 반영되지 않는 사례가 반복되고 있다.</p><p>둘째, 문제가 발생한 이후 자신의 행동보다 상대방의 반응을 문제로 보는 경우가 존재한다.</p><p>셋째, 특정 인물에 대한 평가와 다른 인물에 대한 평가 사이에 큰 차이가 존재한다.</p><p>넷째, 2024년에는 서버 권한, 운영, 집단 내 갈등이 중심이었으나 2025~2026년으로 갈수록 개인적인 관계, 별명, 취향, 음악, 가족, 전 연인 등 개인적인 경계에 관한 문제가 증가하였다.</p><p>다섯째, 문제 발생 → 사과 또는 관계 회복 → 이후 유사한 문제 재발이라는 흐름이 여러 차례 확인된다.</p><hr><p>각 사건의 의도에 대해서는 일률적인 판단을 내리기 어렵다. 장난, 호감, 분노 및 개인적인 판단 등이 복합적으로 작용하였을 가능성이 존재한다.</p><p><b>그러나 의도와 결과는 별개의 문제이다. 상대방이 불쾌감을 표시하였음에도 유사한 문제가 다른 형태로 반복되었다는 점은 본 기록에서 주목할 필요가 있다.</b></p>"],
rel:["인물 관계도","<h2>인물 관계도 (간이)</h2><pre>            [ 규민 ]\n   ┌──────────┼───────────┐\n [ 하누리 ]   [ os ]    [ 이모씨 ]\n                          │\n        ┌────────┬────────┼────────┐\n   [ 안산암 ]  [ 아포 ]  [ 뮤시 ]  [ 하누리 ]\n   (GSIT 지도자) (마익)   (찬양)   (2023, 2025)</pre><p>규민 ― 이모씨 ：2024년 이후 갈등과 관계 회복이 반복되어 온 것으로 알려져 있다.<br>이모씨 ― 안산암 ：접근 및 개인적인 감정에 관한 기록이 존재한다.<br>이모씨 ― 아포 ：마익을 둘러싼 개입의 기록이 존재한다.<br>이모씨 ― 뮤시 ：이상화 및 찬양의 기록이 존재한다.<br>os ：초대 링크 게시에 관여하였다.</p><p class='sm'>※ 김하늘에 대하여서는 사건 12 및 14에 관련 기록이 있다.</p>"],
act:["처리・추방 기록","<h2>처리・추방 기록</h2><table class='r'><tr><th>일시</th><th>내용</th></tr><tr><td>2024년 1월</td><td>강등 및 신뢰의 하락 (규민의 변호로 영구 퇴출은 회피)</td></tr><tr><td>2024년 5월 19일</td><td>자닐라 서버 권한으로부터 물러남</td></tr><tr><td>2024년 5월 25일</td><td>서버 탈퇴 후, 다른 사람으로서 재입장</td></tr><tr><td>2024년 8월 26일</td><td>권한 설정 착오 (규민이 퇴장 후 재입장)</td></tr><tr><td>2024년 10월</td><td>탄핵</td></tr><tr><td>2024년 10월 31일</td><td>서버에서 추방</td></tr><tr><td>2024년 11월 12일</td><td>회의 이후, 일정 기간의 추방 처분</td></tr><tr><td>2025년 12월</td><td>서버 내 직책에서 물러남</td></tr></table><p class='sm'>본 사건에 관한 상세한 자료는 현재 정리 중입니다.</p>"],
his:["현재까지의 경위","<h2>현재까지의 경위</h2><p>2023년부터 현재까지의 기록을 종합하면, 이모씨와 관계자 사이에서는 여러 차례의 분쟁과 관계 회복이 반복되어 온 것을 확인할 수 있다.</p><p>일부 사건 이후 관계가 회복된 사례도 존재하였으나, 이후 유사한 성격의 문제가 다른 형태로 다시 발생한 경우도 확인되고 있다.</p><p>각 사건의 의도에 대해서는 일률적인 판단을 내리는 것이 곤란하다.</p><p>그러나 상대방이 명확하게 불쾌감을 표시한 이후에도 유사한 문제가 반복되었다는 점은 주목할 필요가 있다.</p><p>특히 초기에는 서버 운영 및 권한에 관한 문제가 많았으나, 시간이 지날수록 개인적인 관계와 취향, 가족 및 인간관계에 관한 문제로 범위가 이동하고 있다는 점이 특징적이다.</p><hr><p style='font-size:11px'><b>본 기록은 현재에도 종료되지 않았다.</b></p>"],
bbs:["BBS","<h2>BBS (방명록)</h2><p class='sm'>※ 광고 및 비방 글은 삭제하겠습니다.</p><div class='bb'><b>No.003</b> 처음 뵙겠습니다 ｜ 2026/10/06<br>처음 방문하였습니다. 자료의 정리에 있어서 감사드립니다.</div><div class='bb'><b>No.002</b> 읽었습니다 ｜ 2026/09/30<br>연표를 끝까지 읽게 되었습니다. 충분한 주의가 필요하다고 생각하였습니다.</div><div class='bb'><b>No.001</b> 관리자 ｜ 2007/04/01<br>BBS를 설치하였습니다. 많은 서명을 부탁드립니다.</div><p class='sm'>※ 현재 게시 기능은 점검 중입니다. 관리자에게 메일로 알려 주십시오.</p>"]};
const nav=document.getElementById('nav'),main=document.getElementById('main');
let bgm=false,ac,tm,st=0;
function show(k){if(!P[k])k='main';
nav.innerHTML='<h4>MENU</h4>'+Object.keys(P).map(i=>`<a href="#${i}" class="${i==k?'cur':''}">▶ ${P[i][0]}</a>`).join('')+
`<h4>BGM</h4><a href="#" onclick="tg();return false">${bgm?'[ON] ♪ OFF로':'[OFF] ♪ ON으로'}</a><h4>COUNTER</h4><div class="cnt"><span>0</span><span>0</span><span>0</span><span>6</span><span>6</span><span>6</span></div><div class="sm">당신은 000666번째 방문자입니다.</div><h4>Last Update</h4><div class="sm">2026/10/07</div><p class="sm">이 페이지는 링크 프리입니다.</p>`;
main.innerHTML=P[k][1]+'<div class="end">본 기록은 현재에도 종료되지 않았다.</div>';
const f=(a,i)=>`<div class="ev" id="e${i}"><div class="t" onclick="this.parentNode.classList.toggle('o')">No.${String(i+1).padStart(2,'0')} ｜ ${a[0]} ｜ ${a[1]}</div><div class="d">${a[2]}<br><br>${a[3]}</div></div>`;
if(k=='main'){rec.innerHTML=[18,19,20].map(i=>`<div>${E[i][0]} ― <a href="#tl">${E[i][1]}</a> <span class="red">NEW!</span></div>`).join('')}
if(k=='tl'){let h='',y='';E.forEach((a,i)=>{const yy=a[0].slice(0,4);if(yy!=y){y=yy;h+=`<div class="yr">■ ${y}년</div>`}h+=f(a,i)});tl.innerHTML=h}
if(k=='rank')rk.innerHTML=RK.map((n,i)=>`<tr><td align="center"><b>${i+1}위</b></td><td>${E[n-1][1]}</td><td>${E[n-1][0]}</td></tr>`).join('');
window.scrollTo(0,0)}
function tg(){bgm=!bgm;if(bgm){ac=ac||new (window.AudioContext||window.webkitAudioContext)();const M=[60,64,67,72,67,64,65,69,72,77,72,69,67,71,74,79,74,71,60,64,67,72,76,72,67,65,64,62,60];
tm=setInterval(()=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=440*Math.pow(2,(M[st%M.length]-69)/12);g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.28);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3);st++},300)}else clearInterval(tm);show(location.hash.slice(1))}
onhashchange=()=>show(location.hash.slice(1));show(location.hash.slice(1));
